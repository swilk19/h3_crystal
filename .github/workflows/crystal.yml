name: build

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 1.10.1 is the shard.yml floor; 1.21.1 is the .mise.toml dev version (latest).
        crystal: ["1.10.1", "1.21.1"]

    container:
      image: crystallang/crystal:${{ matrix.crystal }}

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        apt-get update -y
        apt-get install cmake make gcc libtool -y
    - name: Check cmake version
      run: cmake --version
    - name: Build H3 C library
      run: make -C ext
    - name: Install shards
      run: shards install
    - name: Linting
      run: |
        crystal tool format --check
    - name: Run tests
      run: |
        crystal spec --verbose
